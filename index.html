<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Transit News - Live Portal</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(16, 185, 129, 0.8); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        .dark .glass-header { background: rgba(24, 24, 27, 0.85); }
    </style>
</head>
<body class="h-full bg-zinc-100 text-zinc-800 dark:bg-zinc-950 dark:text-zinc-100 font-sans flex flex-col antialiased transition-colors duration-300">

    <!-- Top Header Navigation -->
    <header class="glass-header border-b border-zinc-200 dark:border-zinc-800 sticky top-0 z-30 shadow-sm transition-colors">
        <div class="px-5 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <button id="toggle-sidebar-btn" class="lg:hidden p-2 rounded-xl text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-800 focus:outline-none">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <div class="flex items-center space-x-3 cursor-pointer" id="logo-home-btn">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-500 flex items-center justify-center text-white font-black text-2xl shadow-lg shadow-emerald-500/30">
                        <i class="fa-solid fa-train"></i>
                    </div>
                    <div>
                        <h1 class="font-black text-xl leading-none tracking-tight text-zinc-900 dark:text-white flex items-center gap-1.5">
                            LIVE<span class="text-emerald-500">TRANSIT</span>
                        </h1>
                        <p class="text-[11px] text-zinc-500 dark:text-zinc-400 font-semibold tracking-widest uppercase mt-0.5">Noticias de Transporte Global</p>
                    </div>
                </div>
            </div>

            <!-- Global Search Bar in Header -->
            <div class="hidden md:flex items-center flex-1 max-w-xl mx-8 relative group">
                <i class="fa-solid fa-magnifying-glass absolute left-4 text-zinc-400 group-focus-within:text-emerald-500 transition-colors"></i>
                <input type="text" id="global-search" placeholder="Buscar noticias, países o sistemas de metro..." class="w-full pl-11 pr-10 py-3 text-sm bg-zinc-200/50 dark:bg-zinc-900 border border-transparent focus:border-emerald-500 rounded-2xl focus:outline-none dark:text-white transition-all shadow-inner focus:bg-white dark:focus:bg-zinc-900">
                <button id="clear-global-search" class="hidden absolute right-4 text-zinc-400 hover:text-zinc-600 text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="flex items-center space-x-3 sm:space-x-4">
                <div class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-2xl bg-emerald-100 dark:bg-emerald-900/30 text-xs font-bold text-emerald-700 dark:text-emerald-400">
                    <span class="relative flex h-2.5 w-2.5">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    <span id="update-status">Actualizando cada 1 min</span>
                </div>

                <!-- Theme Toggle -->
                <button id="theme-toggle" class="w-10 h-10 flex items-center justify-center text-zinc-500 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-zinc-800 rounded-full transition-colors">
                    <i id="theme-toggle-dark-icon" class="fa-solid fa-moon text-lg hidden"></i>
                    <i id="theme-toggle-light-icon" class="fa-solid fa-sun text-lg text-amber-500"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Body Container -->
    <div class="flex flex-1 overflow-hidden relative">

        <!-- Sidebar Navigation (Left Panel) -->
        <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-20 w-80 bg-white dark:bg-zinc-900 border-r border-zinc-200 dark:border-zinc-800 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col h-[calc(100vh-81px)] shadow-2xl lg:shadow-none">
            
            <!-- Sidebar Header / Filter -->
            <div class="p-5 border-b border-zinc-200 dark:border-zinc-800 space-y-4">
                <button id="btn-all-metros" class="w-full flex items-center justify-between p-3.5 rounded-2xl bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 font-bold text-sm shadow-md hover:scale-[1.02] transition-all">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-earth-americas"></i>
                        <span>FEED GLOBAL</span>
                    </div>
                    <span id="total-global-count" class="bg-zinc-700 dark:bg-zinc-300 px-2.5 py-1 rounded-lg text-[11px] font-black">0</span>
                </button>

                <div class="relative">
                    <i class="fa-solid fa-filter absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-400 text-xs"></i>
                    <input type="text" id="sidebar-metro-search" placeholder="Filtrar regiones..." class="w-full pl-9 pr-4 py-2.5 text-xs bg-zinc-100 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl focus:outline-none focus:border-emerald-500 dark:text-white transition-colors">
                </div>
            </div>

            <!-- List of Metros -->
            <div id="metro-sidebar-tree" class="flex-1 overflow-y-auto p-4 space-y-5">
                <!-- Populated dynamically -->
            </div>
        </aside>

        <!-- Sidebar Mobile Overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-zinc-900/80 backdrop-blur-sm z-10 hidden lg:hidden"></div>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto bg-zinc-50 dark:bg-zinc-950 p-4 sm:p-8 flex flex-col space-y-6">
            
            <!-- Active Metro Hero -->
            <div id="active-metro-hero" class="bg-white dark:bg-zinc-900 rounded-3xl shadow-sm border border-zinc-200/80 dark:border-zinc-800 overflow-hidden transition-all">
                <!-- Rendered dynamically -->
            </div>

            <!-- Category Pills -->
            <div class="flex items-center gap-2 flex-wrap" id="category-filters">
                <button data-category="all" class="cat-btn px-4 py-2 text-sm font-bold rounded-2xl bg-emerald-500 text-white shadow-md shadow-emerald-500/20 transition-all">
                    Última Hora
                </button>
                <button data-category="Infraestructura" class="cat-btn px-4 py-2 text-sm font-semibold rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-300 hover:border-emerald-500 transition-all">
                    Infraestructura
                </button>
                <button data-category="Servicio" class="cat-btn px-4 py-2 text-sm font-semibold rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-300 hover:border-emerald-500 transition-all">
                    Servicio
                </button>
            </div>

            <!-- News Cards Grid -->
            <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Articles dynamically generated -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex-1 flex flex-col items-center justify-center py-20 text-center">
                <div class="w-20 h-20 bg-zinc-200 dark:bg-zinc-800 text-zinc-400 rounded-3xl flex items-center justify-center text-3xl mb-4 shadow-inner">
                    <i class="fa-solid fa-satellite-dish"></i>
                </div>
                <h3 class="text-lg font-bold text-zinc-800 dark:text-zinc-200 mb-2">Escaneando señales...</h3>
                <p class="text-sm text-zinc-500 max-w-md">No hay noticias en este momento. El sistema está buscando actualizaciones reales en los portales.</p>
            </div>

        </main>
    </div>

    <!-- Article Modal -->
    <div id="article-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-zinc-900/80 backdrop-blur-md hidden transition-opacity opacity-0">
        <div class="bg-white dark:bg-zinc-900 rounded-[2rem] shadow-2xl border border-zinc-200 dark:border-zinc-800 max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden transform scale-95 transition-transform duration-300">
            
            <div class="px-8 py-5 border-b border-zinc-100 dark:border-zinc-800 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span id="modal-flag" class="text-2xl"></span>
                    <span id="modal-portal" class="text-sm font-black text-emerald-600 dark:text-emerald-400">
                        Portal Oficial
                    </span>
                </div>
                <button id="close-modal" class="w-10 h-10 flex items-center justify-center rounded-full text-zinc-400 hover:text-zinc-700 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div class="p-8 overflow-y-auto">
                <div class="flex items-center space-x-2 text-xs font-bold text-zinc-500 mb-4 uppercase tracking-wider">
                    <i class="fa-regular fa-clock"></i>
                    <span id="modal-date">Fecha</span>
                </div>

                <h2 id="modal-title" class="text-2xl sm:text-3xl font-black text-zinc-900 dark:text-white leading-tight mb-6">
                    Título de la noticia
                </h2>

                <div class="relative rounded-2xl overflow-hidden shadow-lg mb-6 bg-zinc-200 dark:bg-zinc-800 aspect-video">
                    <img id="modal-image" src="" alt="Noticia Metro" class="w-full h-full object-cover">
                </div>

                <div id="modal-body" class="prose dark:prose-invert max-w-none text-zinc-600 dark:text-zinc-300 text-base leading-relaxed">
                    <!-- Article text -->
                </div>
            </div>

            <div class="p-6 border-t border-zinc-100 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900/50 flex flex-col sm:flex-row items-center justify-end gap-4">
                <button id="close-modal-btn" class="w-full sm:w-auto px-6 py-3 text-sm font-bold rounded-2xl bg-zinc-200 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 hover:bg-zinc-300 transition-colors">
                    Cerrar
                </button>
                <a id="modal-official-link" href="#" target="_blank" class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-bold transition-all flex items-center justify-center space-x-2 shadow-lg shadow-emerald-500/30">
                    <span>Ir directo al portal de noticias</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Utilizamos la misma base de datos de países para la estructura
        const metroDataHierarchy = [
            {
                continent: "América & Europa (Fuentes Principales)",
                countries: [
                    { country: "Argentina", flag: "🇦🇷", metros: [{ id: "arg_metro", name: "Redes Argentina", portal: "Diarios de Argentina" }] },
                    { country: "México", flag: "🇲🇽", metros: [{ id: "mex_metro", name: "Redes México", portal: "Diarios de México" }] },
                    { country: "España", flag: "🇪🇸", metros: [{ id: "esp_metro", name: "Redes España", portal: "Diarios de España" }] },
                    { country: "Chile", flag: "🇨🇱", metros: [{ id: "chi_metro", name: "Redes Chile", portal: "Diarios de Chile" }] },
                    { country: "Colombia", flag: "🇨🇴", metros: [{ id: "col_metro", name: "Redes Colombia", portal: "Diarios de Colombia" }] }
                ]
            }
        ];

        let flatMetroList = [];
        metroDataHierarchy.forEach(cont => {
            cont.countries.forEach(c => {
                c.metros.forEach(m => flatMetroList.push({ ...m, country: c.country, flag: c.flag, continent: cont.continent }));
            });
        });

        let newsDatabase = [];
        let selectedMetroId = "all";
        let selectedCategory = "all";
        let searchQuery = "";

        // API para extraer enlaces directos sin pasar por Google (Bing News RSS nos da el link directo a la web del diario)
        async function fetchRealNews() {
            try {
                // Indicador visual de actualización
                const statusDot = document.querySelector('.animate-ping');
                if(statusDot) {
                    statusDot.classList.remove('bg-emerald-400');
                    statusDot.classList.add('bg-amber-400');
                }

                // Usamos Bing RSS que entrega el link original directo al portal (Ej: elpais.com, clarin.com, etc.)
                const query = encodeURIComponent('metro transporte publico subte tren');
                const rssUrl = encodeURIComponent(`https://www.bing.com/news/search?q=${query}&format=rss`);
                const url = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (data.status === 'ok' && data.items.length > 0) {
                    data.items.forEach((article, index) => {
                        const exists = newsDatabase.find(n => n.title === article.title);
                        
                        if (!exists) {
                            // Extraer nombre del diario real de la URL para mostrarlo
                            let portalName = "Portal de Noticias";
                            try {
                                const domain = new URL(article.link).hostname;
                                portalName = domain.replace('www.', '').split('.')[0].toUpperCase();
                            } catch(e) {}

                            // Extraer imagen si existe, sino usar un placeholder moderno
                            let imgUrl = article.thumbnail || 'https://images.unsplash.com/photo-1599839619722-39751411ea63?auto=format&fit=crop&w=800&q=80';

                            const newArticle = {
                                id: `news_live_${Date.now()}_${index}`,
                                metroId: "all",
                                metroName: "Alerta Global",
                                country: "Internacional",
                                flag: "📰",
                                portal: portalName, // Enlace directo al diario original
                                category: "Última Hora", 
                                title: article.title,
                                summary: article.description.replace(/<[^>]+>/g, '').substring(0, 150) + '...',
                                body: `<div class="p-5 bg-zinc-100 dark:bg-zinc-800/50 rounded-2xl border border-zinc-200 dark:border-zinc-700 text-center">
                                         <i class="fa-solid fa-link text-3xl text-emerald-500 mb-3"></i>
                                         <p class="font-bold text-lg">Enlace Directo Protegido</p>
                                         <p class="text-sm mt-2 text-zinc-500 dark:text-zinc-400">Estás a punto de visitar el artículo original en la web oficial de <strong>${portalName}</strong>. No usamos redirecciones de buscadores.</p>
                                       </div>`,
                                image: imgUrl,
                                date: new Date(article.pubDate).toLocaleTimeString('es-ES', { hour: '2-digit', minute:'2-digit' }) + ' hs',
                                officialUrl: article.link // ESTE ES EL LINK DIRECTO (Sin Google)
                            };
                            
                            newsDatabase.unshift(newArticle);
                        }
                    });

                    renderSidebar();
                    renderActiveHero();
                    renderNewsGrid();
                }

                // Restaurar indicador visual
                setTimeout(() => {
                    if(statusDot) {
                        statusDot.classList.remove('bg-amber-400');
                        statusDot.classList.add('bg-emerald-400');
                    }
                }, 1000);

            } catch (error) {
                console.error("Error buscando noticias:", error);
            }
        }

        // Render Funciones
        function renderSidebar() {
            const sidebarContainer = document.getElementById("metro-sidebar-tree");
            sidebarContainer.innerHTML = "";
            const filterText = document.getElementById("sidebar-metro-search").value.toLowerCase().trim();

            metroDataHierarchy.forEach(continentObj => {
                const contDiv = document.createElement("div");
                contDiv.innerHTML = `<div class="text-[10px] font-black uppercase tracking-widest text-zinc-400 mb-2 px-2">${continentObj.continent}</div>`;
                
                continentObj.countries.forEach(countryObj => {
                    const countryBox = document.createElement("div");
                    countryBox.className = "mb-1";
                    countryBox.innerHTML = `<div class="text-sm font-bold text-zinc-800 dark:text-zinc-200 flex items-center gap-2 py-2 px-2 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-xl cursor-pointer transition-colors"><span>${countryObj.flag}</span> <span>${countryObj.country}</span></div>`;
                    contDiv.appendChild(countryBox);
                });
                sidebarContainer.appendChild(contDiv);
            });

            document.getElementById("total-global-count").textContent = newsDatabase.length;
        }

        function renderActiveHero() {
            const heroEl = document.getElementById("active-metro-hero");
            heroEl.innerHTML = `
                <div class="p-8 sm:p-10 bg-zinc-900 dark:bg-zinc-950 text-white relative overflow-hidden">
                    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-emerald-500 via-zinc-900 to-zinc-900"></div>
                    <div class="relative z-10 space-y-4 max-w-3xl">
                        <div class="flex items-center space-x-2 text-xs font-black text-emerald-400 uppercase tracking-widest bg-emerald-400/10 w-max px-3 py-1.5 rounded-full border border-emerald-400/20">
                            <span class="animate-pulse w-2 h-2 bg-emerald-400 rounded-full"></span>
                            <span>En vivo: Fuentes Directas</span>
                        </div>
                        <h2 class="text-3xl sm:text-5xl font-black tracking-tight leading-tight">Radar de Transporte Público Internacional</h2>
                        <p class="text-sm sm:text-base text-zinc-400 leading-relaxed font-medium">
                            Monitoreando portales periodísticos directamente. Sin intermediarios, sin redirecciones de buscadores.
                        </p>
                    </div>
                </div>
            `;
        }

        function renderNewsGrid() {
            const gridEl = document.getElementById("news-grid");
            const emptyEl = document.getElementById("empty-state");
            gridEl.innerHTML = "";

            let list = newsDatabase.filter(item => {
                if (searchQuery.trim() !== "") {
                    const q = searchQuery.toLowerCase();
                    return item.title.toLowerCase().includes(q) || item.portal.toLowerCase().includes(q);
                }
                return true;
            });

            if (list.length === 0) {
                emptyEl.classList.remove("hidden");
                gridEl.classList.add("hidden");
                return;
            }

            emptyEl.classList.add("hidden");
            gridEl.classList.remove("hidden");

            list.forEach(item => {
                const card = document.createElement("article");
                card.className = "bg-white dark:bg-zinc-900 rounded-3xl border border-zinc-200 dark:border-zinc-800 overflow-hidden shadow-sm hover:shadow-xl hover:shadow-emerald-500/5 hover:-translate-y-1 transition-all duration-300 flex flex-col group cursor-pointer";
                
                card.innerHTML = `
                    <div class="relative overflow-hidden h-48 bg-zinc-200 dark:bg-zinc-800">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute top-4 left-4">
                            <span class="text-[10px] font-black uppercase px-3 py-1.5 rounded-xl bg-white/90 dark:bg-zinc-900/90 text-zinc-900 dark:text-white backdrop-blur-md shadow-sm">
                                ${item.portal}
                            </span>
                        </div>
                    </div>
                    <div class="p-6 flex-1 flex flex-col justify-between space-y-4">
                        <div class="space-y-3">
                            <div class="flex items-center justify-between text-xs text-zinc-500 dark:text-zinc-400 font-bold">
                                <span class="flex items-center gap-1"><i class="fa-solid fa-bolt text-emerald-500"></i> ${item.category}</span>
                                <span>${item.date}</span>
                            </div>
                            <h3 class="font-black text-zinc-900 dark:text-white text-lg leading-tight group-hover:text-emerald-500 transition-colors line-clamp-3">
                                ${item.title}
                            </h3>
                        </div>
                    </div>
                `;
                
                // Abrir modal al hacer clic en toda la tarjeta
                card.addEventListener("click", () => openModal(item));
                gridEl.appendChild(card);
            });
        }

        function openModal(item) {
            document.getElementById("modal-flag").textContent = item.flag;
            document.getElementById("modal-portal").textContent = item.portal;
            document.getElementById("modal-title").textContent = item.title;
            document.getElementById("modal-date").textContent = "Publicado hoy a las " + item.date;
            document.getElementById("modal-image").src = item.image;
            document.getElementById("modal-body").innerHTML = item.body;
            document.getElementById("modal-official-link").href = item.officialUrl;

            const modal = document.getElementById("article-modal");
            modal.classList.remove("hidden");
            setTimeout(() => {
                modal.classList.remove("opacity-0");
                modal.querySelector("div").classList.remove("scale-95");
            }, 10);
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            const modal = document.getElementById("article-modal");
            modal.classList.add("opacity-0");
            modal.querySelector("div").classList.add("scale-95");
            setTimeout(() => {
                modal.classList.add("hidden");
                document.body.style.overflow = "";
            }, 300);
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchRealNews();

            // ACTUALIZACIÓN CADA 1 MINUTO (60,000 milisegundos)
            setInterval(fetchRealNews, 60 * 1000);

            renderSidebar();
            renderActiveHero();
            renderNewsGrid();

            // Búsqueda global
            const globalSearch = document.getElementById("global-search");
            const clearBtn = document.getElementById("clear-global-search");

            globalSearch.addEventListener("input", (e) => {
                searchQuery = e.target.value;
                clearBtn.classList.toggle("hidden", searchQuery === "");
                renderNewsGrid();
            });

            clearBtn.addEventListener("click", () => {
                globalSearch.value = "";
                searchQuery = "";
                clearBtn.classList.add("hidden");
                renderNewsGrid();
            });

            // Theme Toggle
            const themeBtn = document.getElementById("theme-toggle");
            themeBtn.addEventListener("click", () => {
                document.documentElement.classList.toggle("dark");
                document.getElementById("theme-toggle-dark-icon").classList.toggle("hidden");
                document.getElementById("theme-toggle-light-icon").classList.toggle("hidden");
            });

            // Modal Cierres
            document.getElementById("close-modal").addEventListener("click", closeModal);
            document.getElementById("close-modal-btn").addEventListener("click", closeModal);
            
            // Móvil
            document.getElementById("toggle-sidebar-btn").addEventListener("click", () => {
                document.getElementById("sidebar").classList.remove("-translate-x-full");
                document.getElementById("sidebar-overlay").classList.remove("hidden");
            });
            document.getElementById("sidebar-overlay").addEventListener("click", () => {
                document.getElementById("sidebar").classList.add("-translate-x-full");
                document.getElementById("sidebar-overlay").classList.add("hidden");
            });
        });
    </script>
</body>
</html>
